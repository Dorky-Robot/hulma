[package]
name = "hulma"
version = "0.2.1"
edition = "2021"
description = "Project-aware Claude Code scaffolder — generates review agents, slash commands, and hook templates"
license = "MIT"
repository = "https://github.com/Dorky-Robot/hulma"
homepage = "https://github.com/Dorky-Robot/hulma"

[[bin]]
name = "hulma"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
